<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linguistic Lens</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.9;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: white;
      color: #667eea;
    }

    .btn-primary:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .mode-section {
      margin-bottom: 20px;
    }

    .mode-title {
      font-size: 14px;
      margin-bottom: 12px;
      font-weight: 600;
      text-align: center;
    }

    .mode-buttons {
      display: flex;
      gap: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 16px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .mode-btn:active {
      transform: translateY(0);
    }

    .mode-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .mode-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .mode-desc {
      font-size: 11px;
      opacity: 0.8;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      opacity: 0.7;
    }

    .footer a {
      color: white;
      text-decoration: underline;
    }

    .status-message {
      background: rgba(255, 255, 255, 0.2);
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }

    .status-message.visible {
      display: block;
    }

    .status-message.success {
      background: rgba(126, 211, 33, 0.3);
    }

    .status-message.error {
      background: rgba(226, 74, 74, 0.3);
    }

    .settings-link {
      text-align: center;
      margin-top: 16px;
    }

    .settings-link a {
      color: white;
      text-decoration: none;
      font-size: 12px;
      opacity: 0.8;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .settings-link a:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🔍</div>
    <h1>Linguistic Lens</h1>
    <div class="subtitle">ניתוח לשוני חכם לקוראים בעברית</div>
  </div>

  <div id="statusMessage" class="status-message"></div>

  <div id="modeSection" class="mode-section">
    <div class="mode-title">בחר מצב ניתוח:</div>
    <div class="mode-buttons">
      <div class="mode-btn" id="quickModeBtn">
        <div class="mode-icon">⚡</div>
        <div class="mode-name">מצב מהיר</div>
        <div class="mode-desc">ניתוח בסיסי (2-3 שניות)</div>
      </div>
      <div class="mode-btn" id="deepModeBtn">
        <div class="mode-icon">🧠</div>
        <div class="mode-name">מצב מתקדם</div>
        <div class="mode-desc">ניתוח מעמיק מלא</div>
      </div>
    </div>
  </div>

  <div class="settings-link">
    <a href="#" id="settingsLink">⚙️ הגדרות ומילים שנלמדו</a>
  </div>

  <div class="footer">
    <div>Powered by Gemini 2.0 Flash</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
