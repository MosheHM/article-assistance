<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Generator - Linguistic Lens</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <h1>Linguistic Lens Icon Generator</h1>
  <p>Click the buttons below to generate and download icons</p>

  <canvas id="canvas128" width="128" height="128"></canvas>
  <canvas id="canvas48" width="48" height="48"></canvas>
  <canvas id="canvas16" width="16" height="16"></canvas>

  <br>

  <button onclick="generateIcons()">Generate Icons</button>
  <button onclick="downloadIcon(128)">Download 128x128</button>
  <button onclick="downloadIcon(48)">Download 48x48</button>
  <button onclick="downloadIcon(16)">Download 16x16</button>

  <script>
    function generateIcons() {
      [128, 48, 16].forEach(size => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');

        // Create gradient background
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, '#667eea');
        gradient.addColorStop(1, '#764ba2');

        // Draw background
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(size/2, size/2, size/2 - 2, 0, Math.PI * 2);
        ctx.fill();

        // Draw emoji/text
        ctx.font = `${size * 0.5}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'white';
        ctx.fillText('🔍', size/2, size/2);
      });

      alert('Icons generated! Click the download buttons to save them.');
    }

    function downloadIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    // Generate on load
    window.onload = generateIcons;
  </script>
</body>
</html>
